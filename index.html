<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Student Expense Tracker</title>
 <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
  <header>
   <h1>Student Expense Tracker</h1>   <p>Manage your daily expenses smartly!</p>
 </header>
 <div class="total-box">
<h3>Total Expenses</h3>   <h1 id="total">₹0.00</h1>
 </div>
<div class="expense-form">
 <h2>Add New Expense</h2>
    <form id="expenseForm">
                <label for="expenseName">Expense Name</label>
      <input type="text" id="expenseName"
    placeholder="Enter expense name">
<label> for="amount">Amount (₹)</label>
<input type="number" id="amount"
    placeholder="Enter amount" step="any" min="0">
 <label for="category">Category</label>
 <select id="category">
  <option value="Food">Food</option>
  <option value="Travel">Travel</option>
 <option value="Shopping">Shopping</option>
<option value="Education">Education</option>
 <option value="Other">Other</option>
                </select>
  <button type="submit">Add Expense</button>
 </form>
</div>
  <div class="expense-section">
<div class="filter-section">
     <h2>Your Expenses</h2>
 <select id="filter">
    <option value="All">All Categories</option>
      <option value="Food">Food</option>
       <option value="Travel">Travel</option>
          <option value="Shopping">Shopping</option>
 <option value="Education">Education</option>
    <option value="Other">Other</option>
   </select>
    </div>
 <div id="expenseList">
 <p class="empty-message">No expenses added yet!</p>
</div>
 </div>
 </div>
  <script src="script.js"></script>
</body>
</html>
